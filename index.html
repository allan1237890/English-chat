<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的 AI 英语私教</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f0f2f5; margin: 0; display: flex; justify-content: center; height: 100vh; }
        .chat-container { width: 100%; max-width: 600px; background: white; display: flex; flex-direction: column; box-shadow: 0 4px 15px rgba(0,0,0,0.1); height: 100%; }
        .header { background: #007bff; color: white; padding: 15px; text-align: center; font-size: 18px; font-weight: bold; }
        .chat-box { flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 15px; }
        .message { max-width: 80%; padding: 10px 15px; border-radius: 15px; line-height: 1.5; word-wrap: break-word; }
        .message.user { align-self: flex-end; background-color: #007bff; color: white; border-bottom-right-radius: 2px; }
        .message.bot { align-self: flex-start; background-color: #e4e6eb; color: black; border-bottom-left-radius: 2px; }
        .input-area { border-top: 1px solid #ddd; padding: 15px; display: flex; gap: 10px; background: #fff; }
        input[type="text"] { flex: 1; padding: 12px; border: 1px solid #ccc; border-radius: 20px; outline: none; font-size: 16px; }
        input[type="text"]:focus { border-color: #007bff; }
        button { background-color: #007bff; color: white; border: none; padding: 10px 20px; border-radius: 20px; cursor: pointer; font-size: 16px; transition: background 0.2s; }
        button:hover { background-color: #0056b3; }
        button:disabled { background-color: #ccc; cursor: not-allowed; }
        .loading { font-size: 12px; color: #888; text-align: center; margin-top: -10px; display: none; }
    </style>
</head>
<body>

<div class="chat-container">
    <div class="header">English Practice Bot</div>
    <div class="chat-box" id="chatBox">
        <div class="message bot">Hello! I'm your English guide. Let's practice. What would you like to talk about?</div>
    </div>
    <div class="loading" id="loadingIndicator">AI 正在思考中...</div>
    <div class="input-area">
        <input type="text" id="userInput" placeholder="输入英语开始对话..." onkeypress="handleKeyPress(event)">
        <button onclick="sendMessage()" id="sendBtn">发送</button>
    </div>
</div>

<script>
    // --- 配置区域 ---
    // 这里填你之前截图里获取的长 Token
    const API_TOKEN = "eyJhbGciOiJSUzI1NiIsImtpZCI6ImQwZTFhMmYwLWI4MjItNDUyYS1iNGMyLTQxODJkZDViZTliZCJ9.eyJpc3MiOiJodHRwczovL2FwaS5jb3plLmNuIiwiYXVkIjpbImNickZRSkNHUWdIUGVDSVJRTXVLNW9VZEhPMGNtdjJJIl0sImV4cCI6ODIxMDI2Njg3Njc5OSwiaWF0IjoxNzY2MDIyOTk5LCJzdWIiOiJzcGlmZmU6Ly9hcGkuY296ZS5jbi93b3JrbG9hZF9pZGVudGl0eS9pZDo3NTg1MDAzNzU0MjAyNTk1MzgyIiwic3JjIjoiaW5ib3VuZF9hdXRoX2FjY2Vzc190b2tlbl9pZDo3NTg1MDExMDI3MTIxNTM3MDQzIn0.gcb5Dqh6D5MQBmNPhBFsGfSxV4h-T4YFe3Mo6cLrVF-OkKjeW9YCWXDu_fbO1WEnWC4KP8OagUPa88AbluM7yKF-qtyh-rU-cn5aSUTkzokjcEZNeSO4rE_soQrWBgWYTV7p4caOF_e-cDhLrMZ0KdpaYRlqN2xcYlT7OhaubaqAr2mrAlz1cJ4UeAqdtSMxnBxeMZYUXrns0wA3NJXwT7KgHWmNELhpLcfduxoXuG4FImDD6pwRwqWoC4SZ8e9YYZZ4ttuJYwK8d_5gpgeYO0WNjOH5xJuZN37-2xlzW7JSUTrR-g9663aNhp-Wx8jGD4c2fcbOZzzMzbaufb7t2w"; 
    
    // API 地址
    const API_URL = "https://6vmrs2vn8f.coze.site/run";
    
    // 生成一个随机的用户ID，保证每次刷新页面都是新的会话，或者你可以固定它
    const USER_ID = "web_user_" + Math.floor(Math.random() * 10000);

    // --- 逻辑区域 ---
    async function sendMessage() {
        const inputField = document.getElementById('userInput');
        const sendBtn = document.getElementById('sendBtn');
        const chatBox = document.getElementById('chatBox');
        const loading = document.getElementById('loadingIndicator');
        
        const text = inputField.value.trim();
        if (!text) return;

        // 1. 显示用户消息
        addMessage(text, 'user');
        inputField.value = '';
        inputField.disabled = true;
        sendBtn.disabled = true;
        loading.style.display = 'block';

        // 2. 准备发送给后端的数据
        const payload = {
            "user_input_text": text,
            "user_input_audio": null, // 这里必须是 null
            "user_id": USER_ID,
            "user_level": "beginner"  // 这里也可以改成 intermediate 或 advanced
        };

        try {
            // 3. 发起请求
            const response = await fetch(API_URL, {
                method: 'POST',
                headers: {
                    'Authorization': `Bearer ${API_TOKEN}`,
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(payload)
            });

            if (!response.ok) {
                throw new Error(`HTTP error! status: ${response.status}`);
            }

            const data = await response.json();
            
            // 4. 解析 AI 回复 (兼容不同的字段名)
            // 通常是 system_reply_text，也可能是 output_text，视后端逻辑而定
            const replyText = data.system_reply_text || data.output_text || JSON.stringify(data);
            
            addMessage(replyText, 'bot');

        } catch (error) {
            console.error('Error:', error);
            addMessage("出错了: " + error.message, 'bot');
        } finally {
            inputField.disabled = false;
            sendBtn.disabled = false;
            inputField.focus();
            loading.style.display = 'none';
        }
    }

    function addMessage(text, sender) {
        const chatBox = document.getElementById('chatBox');
        const div = document.createElement('div');
        div.classList.add('message', sender);
        div.innerText = text;
        chatBox.appendChild(div);
        chatBox.scrollTop = chatBox.scrollHeight; // 自动滚动到底部
    }

    function handleKeyPress(event) {
        if (event.key === 'Enter') {
            sendMessage();
        }
    }
</script>

</body>
</html>
